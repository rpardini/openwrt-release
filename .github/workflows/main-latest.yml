name: main-latest

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions: write-all # just let it do everything

env:
  # The fork that carries the Dockerfile, the board configs and the files_<board> overlays.
  OPENWRT_REPO: "rpardini/openwrt"
  OPENWRT_BRANCH: "r5s-main-202611"
  # The Dockerfile builds the toolchain, the kernel and all packages once (they're the same for every
  # board: all are rockchip/armv8), seeded with the config below. The per-board image stages
  # then re-point .config at their own board, so this only picks the seed - leave it at r5s.
  SEED_MACHINE_ID: "r5s"
  SEED_OPENWRT_CONFIG: "diffconfig.r5s.final"

jobs:

  # A single job: one Docker build produces every board and variant (r5s/r6c/e24c, custom/generic),
  # and they all go into a single GitHub Release.
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Prepare release ID
        id: prep
        run: |
          echo "created=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      # Clean runner to have more disk space; one runner now builds every board, so we need all of it
      - name: Free Disk Space (GH-hosted runner)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: "Checkout ${{ env.OPENWRT_REPO }} at ${{ env.OPENWRT_BRANCH }}"
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENWRT_REPO }}
          ref: ${{ env.OPENWRT_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }} # github username or org
          password: ${{ secrets.GITHUB_TOKEN }}    # github actions builtin token. repo has to have pkg access.

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1

      # Builds the final stage, which collects /dist from all six per-board image stages (r5s/r6c/e24c, custom + generic). Those stages
      # have no dependencies on each other, so buildx runs them in parallel on this one runner.
      - name: "Build all boards from ${{ env.OPENWRT_BRANCH }}"
        uses: docker/build-push-action@v6
        with:
          #target: # unset, builds the final stage
          load: true # load the final stage, which is just alpine with the built artifacts
          context: .
          file: ./Dockerfile # not local to this repo -- see actions/checkout above
          pull: false # don't pull.
          push: false # don't push, load is enough
          tags: openwrt-build-image:${{ steps.prep.outputs.created }}
          # caching's not worth the trouble and compression/transmit/decompression time
          build-args: |
            MACHINE_ID=${{ env.SEED_MACHINE_ID }}
            OPENWRT_CONFIG=${{ env.SEED_OPENWRT_CONFIG }}
            RELEASE_VERSION=${{ steps.prep.outputs.created }}

      - name: Extract artifacts from docker
        run: docker cp "$(docker create --rm openwrt-build-image:${{ steps.prep.outputs.created }})":/out ./

      - name: Show artifacts and disk usage
        run: |
          ls -lah out/
          df -h .

      # Release the artifacts for every board and variant into a single GitHub Release
      - name: "Release ${{ steps.prep.outputs.created }}"
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ steps.prep.outputs.created }}"
          prerelease: false
          title: "OpenWrt ${{ env.OPENWRT_BRANCH }} - ${{ steps.prep.outputs.created }}"
          files: |
            out/*
